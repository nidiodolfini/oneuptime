name: Medgrupo Build

# Workflow do FORK Medgrupo (nao existe no upstream). Builda as duas imagens do fork
# (app Community e probe) no runner do GitHub e as entrega como artefato.
#
# Por que aqui e nao na maquina de quem faz o rebase: desde a 14.0.107 o type-check do
# App (`npm run compile`, o gate do build) nao cabe mais em 8 GB de RAM. Com o heap padrao
# de 8 GB a VM do Docker so faz swap; com 5,6 GB o tsc morre em "JavaScript heap out of
# memory". O Build do upstream faz o mesmo `docker build --target community` em
# ubuntu-latest, entao o runner padrao comporta.
#
# Dispara no push de uma tag `<upstream>-medgrupo.<n>` e builda o commit da tag:
# APP_VERSION = nome da tag, GIT_SHA = commit. Isso tambem garante a regra da linhagem
# (Docs/medgrupo/lessons-learned.md): a imagem sai do commit taggeado, nunca de arvore
# local. Se o build falhar nao existe imagem: apagar a tag, corrigir e taggear de novo.
#
# O job `publish` carrega os dois artefatos e faz o push no GHCR com o GITHUB_TOKEN.
# Os pacotes oneuptime-app/oneuptime-probe sao do usuario: o repo precisa de Write em
# cada um (Package settings -> Manage Actions access). Sem isso o push da
# "permission_denied: write_package": conceder o acesso e usar "Re-run failed jobs",
# que refaz so o `publish` (os artefatos ficam 3 dias), sem buildar de novo.
# Antes do artefato, o job `app` confere os patches do fork DENTRO da imagem (o app roda
# dos fontes em /usr/src): patch novo = uma linha a mais naquele passo.

on:
  push:
    tags:
      - "*-medgrupo.*"

permissions:
  contents: read

jobs:
  app:
    name: App (Community)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Como nos jobs do upstream: sem isto o configure.sh do prerun faz `git pull`,
      # que falha em checkout de tag (HEAD destacado).
      CI_PIPELINE_ID: ${{ github.run_number }}
      IMAGE: ghcr.io/nidiodolfini/oneuptime-app:${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Render dos Dockerfiles (prerun)
        run: npm run prerun

      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/App/Dockerfile

      - name: Build (o type-check roda aqui dentro)
        run: |
          docker build --target community \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_VERSION="${GITHUB_REF_NAME}" \
            -t "${IMAGE}" -f ./packages/App/Dockerfile .

      - name: Conferir versao e edicao gravadas na imagem
        run: |
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${IMAGE}" \
            | grep -E '^(APP_VERSION|GIT_SHA|IS_ENTERPRISE_EDITION)=' | tee /tmp/env.txt
          grep -qx "APP_VERSION=${GITHUB_REF_NAME}" /tmp/env.txt
          grep -qx "GIT_SHA=${GITHUB_SHA}" /tmp/env.txt
          grep -qx "IS_ENTERPRISE_EDITION=false" /tmp/env.txt

      - name: Conferir os patches do fork dentro da imagem
        run: |
          docker run --rm --entrypoint sh "${IMAGE}" -ec '
            c() { grep -qF "$1" "$2" || { echo "FALTA o patch: $1 em $2" >&2; exit 1; }; echo "ok $2"; }
            c "isManualAction" /usr/src/Common/Server/Services/IncidentStateTimelineService.ts
            c "isManualAction" /usr/src/Common/Server/Services/IncidentMemberService.ts
            c "stalled-job orphan" /usr/src/app/FeatureSet/Telemetry/Jobs/TelemetryIngest/ProcessTelemetry.ts
            c "limit: 100," /usr/src/Common/UI/Components/ModelTable/BaseModelTable.tsx
            c "login-with-keycloak" /usr/src/app/FeatureSet/Accounts/src/Pages/Login.tsx
            c "SSODefaultProjectIds" /usr/src/app/FeatureSet/Identity/API/OIDC.ts
            c "SSODefaultProjectIds" /usr/src/app/FeatureSet/Identity/API/SSO.ts
            c "ColumnLength.Name" /usr/src/Common/Server/Services/UserService.ts
            c "postgresql.cpu.utilization" /usr/src/Common/Types/DatabaseServer/DatabaseServerMetricCatalog.ts
            c "AiResponseLanguage" /usr/src/Common/Server/Utils/AI/Chat/ObservabilityChatPrompt.ts
            c "sendWorkspaceNotification: false" /usr/src/Common/Server/Utils/AI/SRE/IncidentInvestigationRunner.ts
            c "sendWorkspaceNotification: false" /usr/src/app/FeatureSet/Workers/Jobs/IncidentOwners/SendUnresolvedReminderNotification.ts
            c "typeof createBy.data.distinctCountField" /usr/src/Common/Server/Services/DetectionRuleService.ts
            c "typeof updateBy.data.distinctCountField" /usr/src/Common/Server/Services/DetectionRuleService.ts
            c "DEFAULT_MAX_REQUESTS: number = 15000" /usr/src/Common/Server/Utils/DataSecurity/Cloud/Aws/AwsDataSecurityReader.ts
          '

      - name: Salvar a imagem
        run: |
          docker save "${IMAGE}" | gzip -1 > oneuptime-app.tar.gz
          ls -la oneuptime-app.tar.gz
          df -h / | tail -1

      - name: Publicar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: oneuptime-app-${{ github.ref_name }}
          path: oneuptime-app.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Como nos jobs do upstream: sem isto o configure.sh do prerun faz `git pull`,
      # que falha em checkout de tag (HEAD destacado).
      CI_PIPELINE_ID: ${{ github.run_number }}
      IMAGE: ghcr.io/nidiodolfini/oneuptime-probe:${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up gomplate
        uses: ./.github/actions/setup-gomplate

      - name: Render dos Dockerfiles (prerun)
        run: npm run prerun

      - name: Warm base images
        run: bash ./Scripts/GHA/warm_base_images.sh ./packages/Probe/Dockerfile

      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_VERSION="${GITHUB_REF_NAME}" \
            -t "${IMAGE}" -f ./packages/Probe/Dockerfile .

      - name: Conferir versao gravada na imagem
        run: |
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${IMAGE}" \
            | grep -E '^(APP_VERSION|GIT_SHA)=' | tee /tmp/env.txt
          grep -qx "APP_VERSION=${GITHUB_REF_NAME}" /tmp/env.txt
          grep -qx "GIT_SHA=${GITHUB_SHA}" /tmp/env.txt

      - name: Salvar a imagem
        run: |
          docker save "${IMAGE}" | gzip -1 > oneuptime-probe.tar.gz
          ls -la oneuptime-probe.tar.gz
          df -h / | tail -1

      - name: Publicar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: oneuptime-probe-${{ github.ref_name }}
          path: oneuptime-probe.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publicar no GHCR
    needs: [app, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar os artefatos
        uses: actions/download-artifact@v4
        with:
          path: imgs

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Carregar e publicar
        run: |
          for n in app probe; do
            gunzip -c "imgs/oneuptime-${n}-${GITHUB_REF_NAME}/oneuptime-${n}.tar.gz" | docker load
            docker push "ghcr.io/nidiodolfini/oneuptime-${n}:${GITHUB_REF_NAME}"
          done
